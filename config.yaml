# Road section to generate
name: route-napoleon-stvallier-escragnolles

# Start / end points (WGS84). They snap to the nearest vertex of the road, so they
# don't need to be precise: click on the road in Google Maps / Géoportail to
# refine them if needed.
start: {lat: 43.6981, lon: 6.8486}   # Saint-Vallier-de-Thiey
end:   {lat: 43.7312, lon: 6.7784}   # Escragnolles (on the D6085, north of the village)

# In the Alpes-Maritimes the Route Napoléon (ex-N85) is tagged D 6085 in OSM
# (D6085 in the BD TOPO `cpx_numero` field).
osm_ref_regex: "^(D ?6085|N ?85)$"

# Half-width of the corridor around the road axis where LiDAR is kept (m).
# Wide on purpose: shoulders, ditches and banks are useful for the track.
corridor_m: 40

# Margin around the road for terrain (DTM) and orthophotos (m).
terrain_margin_m: 300

# LiDAR HD classes kept: 2 = ground, 17 = bridge deck
lidar_classes: [2, 17]

# Raw LAZ tiles are ~150-400 MB each. false = delete each one
# right after cropping (peak disk usage stays at ~1 tile).
keep_raw_laz: false

ortho_layer: HR.ORTHOIMAGERY.ORTHOPHOTOS
ortho_res_m: 0.2
backdrop_m: 8000          # fetch.py far: distant relief + imagery out to this distance (horizon)
trees_margin_m: 250       # fetch.py mnh: canopy height around the road
buildings_margin_m: 250   # fetch.py buildings
streetview_step_m: 20     # fetch.py streetview: one Panoramax photo every N metres
roadside_band_m: 18       # fetch.py roadside: LiDAR above-ground points within this distance of the axis
# trees:                  # trees.py, e.g.
#   min_height_m: 3
#   max_distance_m: 140

data_dir: data

# Track generation (build_track.py). Everything here has a default.
track:
  id: realroad_rn_stvallier_escragnolles   # AC folder name: content/tracks/<id>
  title: "Route Napoléon — St-Vallier → Escragnolles"
  author: Aymeric Duchene
  city: Saint-Vallier-de-Thiey
  road_width_m: auto         # auto = measured LiDAR edges (road_edges.py), else BD TOPO; or "bdtopo", or a number
  verge_m: 2.5               # verge strip from the road edge to the terrain
  terrain_half_width_m: 120  # terrain kept on each side of the road
  terrain_grid_m: 2.5        # terrain mesh resolution
  far_terrain_m: 290         # coarse terrain ring out to this distance (0 = off)
  markings: auto             # auto = real markings (road_markings.py), texture = generic, none
  trees: true                # tree billboards from trees.csv
  buildings: true            # BD TOPO buildings
  furniture: true            # guard rails, walls, signs, edge posts, poles (fetch.py roadside)
  furniture_posts: true      # J6 edge posts (laid out by the rules, not surveyed)
  z_sigma_m: 6               # Gaussian smoothing of the LiDAR elevation (bumps vs detail)
  crossfall_sigma_m: 10      # Gaussian smoothing of the crossfall
  z_despike_m: 0.06          # isolated elevation spikes larger than this are removed
  # kn5_export.py
  ortho_texture_px: 2048     # orthophoto texture size in the kn5 (1024 = 4x smaller file)
  csp_config: true           # extension/ext_config.ini for Custom Shaders Patch (grass, rain)
  # materials:               # ksPerPixel values per material, e.g.
  #   terrain: {ksAmbient: 0.45, ksDiffuse: 0.35}
